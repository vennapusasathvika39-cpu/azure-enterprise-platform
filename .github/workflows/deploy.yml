

name: Deploy Order API to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Oryx Build Automation
        run: |
          az webapp config appsettings set \
            --resource-group rg-order-dev \
            --name order-api-dev-20261123xyz \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true

      - name: Configure App Service startup
        run: |
          az webapp config set \
            --resource-group rg-order-dev \
            --name order-api-dev-20261123xyz \
            --startup-file "gunicorn --bind=0.0.0.0:8000 app:app"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: order-api-dev-20261123xyz
          package: application


