



name: Order API UAT Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/requirements.txt

      - name: Run automated tests
        run: python -m pytest application/tests -v

  deploy:
    name: Deploy to Azure UAT
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify application files
        run: |
          test -f application/app.py
          test -f application/requirements.txt
          test -f application/schema.sql

      - name: Create deployment package
        run: |
          cd application
          zip -r ../uat-deployment.zip app.py requirements.txt schema.sql init_db.py

      - name: Verify deployment package
        run: unzip -l uat-deployment.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service
        run: |
          az webapp config appsettings set \
            --resource-group rg-order-uat \
            --name order-api-uat-20261127xyz \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

          az webapp config set \
            --resource-group rg-order-uat \
            --name order-api-uat-20261127xyz \
            --startup-file "python init_db.py && gunicorn --bind=0.0.0.0:8000 app:app"

      - name: Deploy to UAT
        uses: azure/webapps-deploy@v3
        with:
          app-name: order-api-uat-20261127xyz
          package: uat-deployment.zip


